<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Realtime Chat Application - Demo Frontend">
    <title>Chat App</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* ── Reset & Variables ──────────────────────────────────── */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg-primary:    #0f0f13;
            --bg-secondary:  #16161d;
            --bg-tertiary:   #1e1e28;
            --bg-glass:      rgba(30, 30, 42, 0.65);
            --border:        rgba(255, 255, 255, 0.06);
            --border-hover:  rgba(255, 255, 255, 0.12);
            --text-primary:  #e8e8ed;
            --text-secondary:#9494a3;
            --text-muted:    #5e5e6e;
            --accent:        #6c63ff;
            --accent-glow:   rgba(108, 99, 255, 0.25);
            --accent-hover:  #7f78ff;
            --success:       #34d399;
            --danger:        #f87171;
            --msg-own:       rgba(108, 99, 255, 0.15);
            --msg-other:     rgba(255, 255, 255, 0.04);
            --radius:        12px;
            --radius-sm:     8px;
            --transition:    0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
        }

        /* ── Layout ────────────────────────────────────────────── */
        .app {
            display: flex;
            height: 100vh;
        }

        /* ── Sidebar ───────────────────────────────────────────── */
        .sidebar {
            width: 320px;
            min-width: 320px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 20px 20px 12px;
            border-bottom: 1px solid var(--border);
        }

        .sidebar-header h1 {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 14px;
            background: linear-gradient(135deg, var(--accent), #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* User Selector */
        .user-selector {
            display: flex;
            gap: 6px;
        }

        .user-btn {
            flex: 1;
            padding: 8px 0;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background: transparent;
            color: var(--text-secondary);
            font-family: inherit;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition);
            text-transform: capitalize;
        }

        .user-btn:hover {
            border-color: var(--border-hover);
            color: var(--text-primary);
        }

        .user-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
            box-shadow: 0 2px 12px var(--accent-glow);
        }

        /* New Conversation Button */
        .new-convo-btn {
            margin: 12px 20px;
            padding: 10px;
            border: 1px dashed var(--border-hover);
            border-radius: var(--radius-sm);
            background: transparent;
            color: var(--text-secondary);
            font-family: inherit;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition);
        }

        .new-convo-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(108, 99, 255, 0.06);
        }

        /* Conversation List */
        .convo-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px 12px;
        }

        .convo-list::-webkit-scrollbar { width: 4px; }
        .convo-list::-webkit-scrollbar-thumb { background: var(--border-hover); border-radius: 2px; }

        .convo-item {
            padding: 12px 14px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all var(--transition);
            margin-bottom: 2px;
        }

        .convo-item:hover {
            background: var(--bg-tertiary);
        }

        .convo-item.active {
            background: var(--bg-tertiary);
            border-left: 3px solid var(--accent);
            padding-left: 11px;
        }

        .convo-item .convo-name {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 2px;
        }

        .convo-item .convo-meta {
            font-size: 11px;
            color: var(--text-muted);
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-muted);
            font-size: 13px;
            text-align: center;
            padding: 20px;
        }

        .empty-state .icon {
            font-size: 40px;
            margin-bottom: 12px;
            opacity: 0.4;
        }

        /* ── Chat Panel ────────────────────────────────────────── */
        .chat-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-primary);
        }

        .chat-header {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            backdrop-filter: blur(12px);
            background: rgba(15, 15, 19, 0.85);
        }

        .chat-header h2 {
            font-size: 15px;
            font-weight: 600;
        }

        .chat-header .members-badge {
            font-size: 11px;
            color: var(--text-muted);
            background: var(--bg-tertiary);
            padding: 4px 10px;
            border-radius: 20px;
        }

        /* Messages Area */
        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .messages-area::-webkit-scrollbar { width: 4px; }
        .messages-area::-webkit-scrollbar-thumb { background: var(--border-hover); border-radius: 2px; }

        .message {
            max-width: 65%;
            padding: 10px 16px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.5;
            animation: msgIn 0.25s ease-out;
            position: relative;
        }

        @keyframes msgIn {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .message.own {
            align-self: flex-end;
            background: var(--msg-own);
            border-bottom-right-radius: 4px;
        }

        .message.other {
            align-self: flex-start;
            background: var(--msg-other);
            border-bottom-left-radius: 4px;
        }

        .message .msg-sender {
            font-size: 11px;
            font-weight: 600;
            color: var(--accent);
            margin-bottom: 2px;
        }

        .message.own .msg-sender {
            color: #a78bfa;
        }

        .message .msg-time {
            font-size: 10px;
            color: var(--text-muted);
            margin-top: 4px;
            text-align: right;
        }

        /* ── Read Receipts Indicators ─────────────────────────── */
        .msg-status {
            display: inline-block;
            margin-left: 5px;
            font-size: 11px;
            letter-spacing: -2px;
            font-weight: 700;
            vertical-align: middle;
            user-select: none;
            transition: color 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Double gray tick = Delivered / Unread */
        .msg-status.unread {
            color: var(--text-muted);
        }

        /* Double blue tick = Read */
        .msg-status.read {
            color: #38bdf8; /* WhatsApp-style electric cyan/blue */
            text-shadow: 0 0 6px rgba(56, 189, 248, 0.4);
        }

        .load-more-btn {
            align-self: center;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            font-family: inherit;
            font-size: 12px;
            padding: 6px 16px;
            border-radius: 20px;
            cursor: pointer;
            transition: all var(--transition);
            margin-bottom: 8px;
        }

        .load-more-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        /* Input Area */
        .input-area {
            padding: 16px 24px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 10px;
            align-items: center;
            background: var(--bg-secondary);
        }

        .input-area input {
            flex: 1;
            padding: 12px 18px;
            border: 1px solid var(--border);
            border-radius: 24px;
            background: var(--bg-tertiary);
            color: var(--text-primary);
            font-family: inherit;
            font-size: 14px;
            outline: none;
            transition: border-color var(--transition);
        }

        .input-area input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .input-area input::placeholder {
            color: var(--text-muted);
        }

        .send-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: none;
            background: var(--accent);
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition);
            flex-shrink: 0;
        }

        .send-btn:hover {
            background: var(--accent-hover);
            box-shadow: 0 4px 16px var(--accent-glow);
            transform: scale(1.05);
        }

        .send-btn:active {
            transform: scale(0.95);
        }

        /* ── Modal ─────────────────────────────────────────────── */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(6px);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.visible {
            display: flex;
        }

        .modal {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 28px;
            width: 400px;
            max-width: 90vw;
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.5);
            animation: modalIn 0.2s ease-out;
        }

        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.95) translateY(10px); }
            to   { opacity: 1; transform: scale(1) translateY(0); }
        }

        .modal h3 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .modal label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 6px;
            margin-top: 14px;
        }

        .modal label:first-of-type {
            margin-top: 0;
        }

        .modal input[type="text"] {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--bg-tertiary);
            color: var(--text-primary);
            font-family: inherit;
            font-size: 13px;
            outline: none;
            transition: border-color var(--transition);
        }

        .modal input[type="text"]:focus {
            border-color: var(--accent);
        }

        .modal .checkbox-group {
            display: flex;
            gap: 16px;
            margin-top: 6px;
        }

        .modal .checkbox-group label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: var(--text-primary);
            cursor: pointer;
            margin-top: 0;
        }

        .modal .checkbox-group input[type="checkbox"] {
            accent-color: var(--accent);
            width: 16px;
            height: 16px;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 24px;
        }

        .modal-actions button {
            padding: 8px 20px;
            border-radius: var(--radius-sm);
            font-family: inherit;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            border: 1px solid var(--border);
            transition: all var(--transition);
        }

        .btn-cancel {
            background: transparent;
            color: var(--text-secondary);
        }

        .btn-cancel:hover {
            border-color: var(--border-hover);
            color: var(--text-primary);
        }

        .btn-create {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }

        .btn-create:hover {
            background: var(--accent-hover);
            box-shadow: 0 2px 12px var(--accent-glow);
        }

        /* ── Toast ─────────────────────────────────────────────── */
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: var(--danger);
            color: #fff;
            padding: 10px 20px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 500;
            z-index: 200;
            animation: toastIn 0.3s ease-out;
            box-shadow: 0 4px 20px rgba(248, 113, 113, 0.3);
        }

        .toast.success {
            background: var(--success);
            box-shadow: 0 4px 20px rgba(52, 211, 153, 0.3);
        }

        @keyframes toastIn {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ── Skeleton Loader ───────────────────────────────────── */
        .skeleton {
            background: linear-gradient(90deg, var(--bg-tertiary) 25%, rgba(255,255,255,0.04) 50%, var(--bg-tertiary) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: var(--radius-sm);
        }

        @keyframes shimmer {
            0%   { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1>💬 Chat App</h1>
                <div class="user-selector" id="userSelector">
                    <button class="user-btn active" data-user="alice">Alice</button>
                    <button class="user-btn" data-user="bob">Bob</button>
                    <button class="user-btn" data-user="mark">Mark</button>
                </div>
            </div>
            <button class="new-convo-btn" id="newConvoBtn">+ New Conversation</button>
            <div class="convo-list" id="convoList">
                <div class="empty-state">
                    <div class="icon">💬</div>
                    No conversations yet.<br>Create one to get started.
                </div>
            </div>
        </aside>

        <!-- Chat Panel -->
        <main class="chat-panel" id="chatPanel">
            <div class="empty-state">
                <div class="icon">👈</div>
                Select a conversation<br>or create a new one.
            </div>
        </main>
    </div>

    <!-- New Conversation Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <h3>New Conversation</h3>
            <label for="convoName">Conversation Name</label>
            <input type="text" id="convoName" placeholder="e.g. Project Alpha">
            <label for="convoDesc">Description (optional)</label>
            <input type="text" id="convoDesc" placeholder="What's this chat about?">
            <label>Add Members</label>
            <div class="checkbox-group" id="memberCheckboxes"></div>
            <div class="modal-actions">
                <button class="btn-cancel" id="cancelModal">Cancel</button>
                <button class="btn-create" id="createConvo">Create</button>
            </div>
        </div>
    </div>

    <script>
        // ── Configuration ──────────────────────────────────────
        const BACKEND_URL = 'https://cgt-chat-mvp.onrender.com';
        const API = `${BACKEND_URL}/api/v1`;
        const WS_BASE = BACKEND_URL.replace(/^http/, 'ws'); // wss://cgt-chat-mvp.onrender.com
        let currentUser = 'alice';
        let currentConvoId = null;
        let conversations = [];
        let nextCursor = null;
        let hasMore = false;

        // WebSocket connection for real-time messages
        let ws = null;

        // Track message IDs we've already rendered (to avoid duplicates)
        const renderedMessageIds = new Set();

        // Track read receipt watermarks
        let lastSentReadId = null;
        let partnerLastReadId = null;

        // All possible users
        const ALL_USERS = ['alice', 'bob', 'mark'];

        // ── Helpers ────────────────────────────────────────────
        function headers() {
            return { 'Content-Type': 'application/json', 'X-User-Id': currentUser };
        }

        function toast(msg, type = 'error') {
            const el = document.createElement('div');
            el.className = `toast ${type}`;
            el.textContent = msg;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 3000);
        }

        function formatTime(iso) {
            const d = new Date(iso);
            return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        // ── Read Receipts Helpers ──────────────────────────────
        function markLatestMessageAsRead() {
            if (!ws || ws.readyState !== WebSocket.OPEN || !currentConvoId) return;

            const area = document.getElementById('messagesArea');
            if (!area) return;

            // Find all message elements currently displayed in the chat
            const messageNodes = area.querySelectorAll('.message[data-msg-id]');
            if (messageNodes.length === 0) return;

            // The latest message is the last element in the container
            const latestNode = messageNodes[messageNodes.length - 1];
            const latestMsgId = latestNode.dataset.msgId;

            // Prevent sending duplicate events for the same message
            if (!latestMsgId || latestMsgId === lastSentReadId) return;

            lastSentReadId = latestMsgId;

            const readEvent = {
                type: 'message.read',
                conversationId: currentConvoId,
                messageId: latestMsgId
            };

            try {
                ws.send(JSON.stringify(readEvent));
                console.log('Emitted message.read for message:', latestMsgId);
            } catch (err) {
                console.warn('Could not send message.read event:', err);
            }
        }

        function applyReadStatusUpTo(targetMessageId) {
            const area = document.getElementById('messagesArea');
            if (!area || !targetMessageId) return;

            const ownMessages = area.querySelectorAll('.message.own[data-msg-id]');
            for (const el of ownMessages) {
                const statusEl = el.querySelector('.msg-status');
                if (statusEl) {
                    statusEl.classList.remove('unread');
                    statusEl.classList.add('read');
                    statusEl.title = 'Read';
                }

                if (el.dataset.msgId === targetMessageId) {
                    break;
                }
            }
        }

        // ── WebSocket ──────────────────────────────────────────
        function connectWebSocket(conversationId) {
            // Close any existing connection
            closeWebSocket();

            const url = `${WS_BASE}/ws/conversations/${conversationId}?user=${currentUser}`;
            ws = new WebSocket(url);

            ws.onopen = () => {
                console.log('WebSocket connected to conversation', conversationId);
                // When socket opens, trigger read check on visible messages
                setTimeout(markLatestMessageAsRead, 250);
            };

            ws.onmessage = (event) => {
                let payload;
                try {
                    payload = JSON.parse(event.data);
                } catch (e) {
                    return;
                }

                const eventType = payload.event || payload.type;

                // 1. Incoming new message
                if (eventType === 'message.created') {
                    const msg = payload.data;
                    if (msg && msg.conversation_id === currentConvoId) {
                        appendMessage(msg);
                        // If viewed and message was sent by someone else, mark as read
                        if (msg.sender_name?.toLowerCase() !== currentUser) {
                            setTimeout(markLatestMessageAsRead, 100);
                        }
                    }
                }

                // 2. Incoming read receipt broadcast
                if (eventType === 'message.read') {
                    const readData = payload.data || payload;
                    const convoId = readData.conversation_id || readData.conversationId;
                    if (convoId === currentConvoId) {
                        const readerName = (readData.user_name || '').toLowerCase();
                        // If another member read messages, update our sent messages to blue ticks
                        if (readerName !== currentUser) {
                            const readMsgId = readData.message_id || readData.messageId;
                            if (readMsgId) {
                                applyReadStatusUpTo(readMsgId);
                            }
                        }
                    }
                }
            };

            ws.onclose = () => {
                console.log('WebSocket disconnected');
            };

            ws.onerror = (err) => {
                console.error('WebSocket error:', err);
            };
        }

        function closeWebSocket() {
            if (ws) {
                ws.close();
                ws = null;
            }
        }

        // ── User Switching ─────────────────────────────────────
        document.getElementById('userSelector').addEventListener('click', (e) => {
            const btn = e.target.closest('.user-btn');
            if (!btn) return;
            currentUser = btn.dataset.user;
            document.querySelectorAll('.user-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentConvoId = null;
            nextCursor = null;
            hasMore = false;
            renderedMessageIds.clear();
            lastSentReadId = null;
            partnerLastReadId = null;
            closeWebSocket();
            loadUsers();
            loadConversations();
            // Reset chat panel
            document.getElementById('chatPanel').innerHTML = `
                <div class="empty-state">
                    <div class="icon">👈</div>
                    Select a conversation<br>or create a new one.
                </div>`;
        });

        // ── Load Conversations ────────────────────────────────
        async function loadConversations() {
            try {
                const res = await fetch(`${API}/conversations`, { headers: headers() });
                if (!res.ok) throw new Error('Failed to load conversations');
                const data = await res.json();
                conversations = data.conversations || [];
                renderConvoList();
            } catch (err) {
                toast(err.message);
            }
        }

        function renderConvoList() {
            const list = document.getElementById('convoList');
            if (conversations.length === 0) {
                list.innerHTML = `<div class="empty-state"><div class="icon">💬</div>No conversations yet.<br>Create one to get started.</div>`;
                return;
            }
            list.innerHTML = conversations.map(c => `
                <div class="convo-item ${c.id === currentConvoId ? 'active' : ''}" data-id="${c.id}">
                    <div class="convo-name">${escapeHtml(c.name)}</div>
                    <div class="convo-meta">${new Date(c.created_at).toLocaleDateString()}</div>
                </div>
            `).join('');

            list.querySelectorAll('.convo-item').forEach(item => {
                item.addEventListener('click', () => selectConversation(item.dataset.id));
            });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ── Select Conversation ───────────────────────────────
        async function selectConversation(id) {
            currentConvoId = id;
            nextCursor = null;
            hasMore = false;
            lastSentReadId = null;
            partnerLastReadId = null;
            renderedMessageIds.clear();
            renderConvoList();

            const convo = conversations.find(c => c.id === id);
            const panel = document.getElementById('chatPanel');
            panel.innerHTML = `
                <div class="chat-header">
                    <h2>${escapeHtml(convo?.name || 'Chat')}</h2>
                    <span class="members-badge" id="membersBadge">loading…</span>
                </div>
                <div class="messages-area" id="messagesArea">
                    <div class="skeleton" style="width:60%;height:36px;margin-bottom:8px;align-self:flex-start;"></div>
                    <div class="skeleton" style="width:45%;height:36px;margin-bottom:8px;align-self:flex-end;"></div>
                    <div class="skeleton" style="width:55%;height:36px;align-self:flex-start;"></div>
                </div>
                <div class="input-area">
                    <input type="text" id="msgInput" placeholder="Type a message…" autocomplete="off">
                    <button class="send-btn" id="sendBtn">▶</button>
                </div>`;

            // Bind send
            document.getElementById('sendBtn').addEventListener('click', sendMessage);
            document.getElementById('msgInput').addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
            });

            // Bind scroll detection for read receipts
            const messagesArea = document.getElementById('messagesArea');
            if (messagesArea) {
                messagesArea.addEventListener('scroll', () => {
                    if (messagesArea.scrollHeight - messagesArea.scrollTop - messagesArea.clientHeight < 80) {
                        markLatestMessageAsRead();
                    }
                });
            }

            // Load members + messages
            await loadMembers(id);
            await loadMessages(id, false);

            // Connect WebSocket for real-time updates on this conversation
            connectWebSocket(id);

            // Trigger initial read of visible messages
            setTimeout(markLatestMessageAsRead, 300);
        }

        // ── Load Members ───────────────────────────────────────
        async function loadMembers(convoId) {
            try {
                const res = await fetch(`${API}/conversations/${convoId}/members`, { headers: headers() });
                if (!res.ok) return;
                const data = await res.json();
                const badge = document.getElementById('membersBadge');
                if (badge) {
                    const names = (data.members || []).map(m => m.user_name || 'unknown');
                    badge.textContent = `${names.join(', ')} (${data.count || names.length})`;
                }

                // In 1-on-1 chats, identify the other member's last read message ID (if provided by backend)
                const otherMember = (data.members || []).find(m => m.user_name?.toLowerCase() !== currentUser);
                partnerLastReadId = otherMember?.last_read_message_id || null;

                // If messages are already in DOM, apply initial read state
                if (partnerLastReadId) {
                    applyReadStatusUpTo(partnerLastReadId);
                }
            } catch (e) { /* silent */ }
        }

        // ── Load Messages ──────────────────────────────────────
        async function loadMessages(convoId, append = false) {
            try {
                let url = `${API}/conversations/${convoId}/messages?limit=30`;
                if (append && nextCursor) url += `&cursor=${nextCursor}`;

                const res = await fetch(url, { headers: headers() });
                if (!res.ok) throw new Error('Failed to load messages');
                const data = await res.json();

                nextCursor = data.next_cursor;
                hasMore = data.has_more;

                const area = document.getElementById('messagesArea');
                if (!area) return;

                // Messages come newest-first from API; reverse for display
                const msgs = [...(data.messages || [])].reverse();

                // Track all loaded message IDs to prevent WebSocket duplicates
                msgs.forEach(m => renderedMessageIds.add(m.id));

                if (!append) {
                    area.innerHTML = '';
                }

                // If loading older (append), prepend messages at top
                if (append) {
                    const oldScroll = area.scrollHeight;
                    const fragment = document.createDocumentFragment();
                    msgs.forEach(m => fragment.appendChild(createMsgEl(m)));
                    // Remove old load-more btn
                    area.querySelector('.load-more-btn')?.remove();
                    area.prepend(fragment);
                    // Keep scroll position
                    area.scrollTop = area.scrollHeight - oldScroll;
                } else {
                    msgs.forEach(m => area.appendChild(createMsgEl(m)));
                    area.scrollTop = area.scrollHeight;
                }

                // Apply partner's read status to messages up to their last read mark
                if (partnerLastReadId) {
                    applyReadStatusUpTo(partnerLastReadId);
                }

                // Add load-more button if has_more
                if (hasMore && !area.querySelector('.load-more-btn')) {
                    const btn = document.createElement('button');
                    btn.className = 'load-more-btn';
                    btn.textContent = '↑ Load older messages';
                    btn.addEventListener('click', () => loadMessages(currentConvoId, true));
                    area.prepend(btn);
                }

                // If no messages
                if (!append && msgs.length === 0) {
                    area.innerHTML = `<div class="empty-state"><div class="icon">💬</div>No messages yet.<br>Say something!</div>`;
                }
            } catch (err) {
                toast(err.message);
            }
        }

        function createMsgEl(m, isRead = false) {
            // Determine the current user by comparing sender name
            const isOwn = m.sender_name?.toLowerCase() === currentUser;
            const el = document.createElement('div');
            el.className = `message ${isOwn ? 'own' : 'other'}`;
            if (m.id) el.dataset.msgId = m.id;

            // Only show ticks on messages sent by the logged-in user
            const statusTicks = isOwn 
                ? `<span class="msg-status ${isRead ? 'read' : 'unread'}" title="${isRead ? 'Read' : 'Delivered'}">✓✓</span>` 
                : '';

            el.innerHTML = `
                <div class="msg-sender">${escapeHtml(m.sender_name || 'Unknown')}</div>
                <div class="msg-content">${escapeHtml(m.content || '')}</div>
                <div class="msg-time">
                    ${formatTime(m.created_at)}
                    ${statusTicks}
                </div>`;
            return el;
        }

        function appendMessage(msg) {
            if (!msg || !msg.id) return;
            if (renderedMessageIds.has(msg.id)) return;

            const area = document.getElementById('messagesArea');
            if (!area) return;

            // Secondary check in DOM to ensure no duplicate element exists
            if (area.querySelector(`[data-msg-id="${msg.id}"]`)) {
                renderedMessageIds.add(msg.id);
                return;
            }

            renderedMessageIds.add(msg.id);
            const empty = area.querySelector('.empty-state');
            if (empty) empty.remove();
            area.appendChild(createMsgEl(msg));
            area.scrollTop = area.scrollHeight;
        }

        // ── Send Message ───────────────────────────────────────
        async function sendMessage() {
            const input = document.getElementById('msgInput');
            const content = input?.value.trim();
            if (!content || !currentConvoId) return;

            input.value = '';
            try {
                const res = await fetch(`${API}/conversations/${currentConvoId}/messages`, {
                    method: 'POST',
                    headers: headers(),
                    body: JSON.stringify({ content }),
                });
                if (!res.ok) {
                    const err = await res.json();
                    throw new Error(err.detail || 'Failed to send');
                }
                const msg = await res.json();
                appendMessage(msg);
            } catch (err) {
                toast(err.message);
            }
        }

        // ── New Conversation Modal ─────────────────────────────
        const modalOverlay = document.getElementById('modalOverlay');

        document.getElementById('newConvoBtn').addEventListener('click', () => {
            // Populate member checkboxes (exclude current user)
            const container = document.getElementById('memberCheckboxes');
            const otherUsers = ALL_USERS.filter(u => u !== currentUser);
            container.innerHTML = otherUsers.map(u => `
                <label>
                    <input type="checkbox" value="${u}" checked>
                    ${u.charAt(0).toUpperCase() + u.slice(1)}
                </label>`).join('');
            document.getElementById('convoName').value = '';
            document.getElementById('convoDesc').value = '';
            modalOverlay.classList.add('visible');
        });

        document.getElementById('cancelModal').addEventListener('click', () => {
            modalOverlay.classList.remove('visible');
        });

        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) modalOverlay.classList.remove('visible');
        });

        document.getElementById('createConvo').addEventListener('click', async () => {
            const name = document.getElementById('convoName').value.trim();
            if (!name) { toast('Please enter a name'); return; }
            const desc = document.getElementById('convoDesc').value.trim() || null;

            const selectedUsernames = [];
            document.querySelectorAll('#memberCheckboxes input[type="checkbox"]:checked').forEach(cb => {
                selectedUsernames.push(cb.value);
            });

            try {
                // Resolve UUIDs for selected users
                const memberIds = [];
                for (const username of selectedUsernames) {
                    const id = resolveUserId(username);
                    if (id) memberIds.push(id);
                }

                // Create conversation with member IDs
                const res = await fetch(`${API}/conversations`, {
                    method: 'POST',
                    headers: headers(),
                    body: JSON.stringify({ name, description: desc, member_ids: memberIds }),
                });

                if (!res.ok) {
                    const err = await res.json();
                    throw new Error(err.detail || 'Failed to create');
                }

                // Read the response BEFORE loadConversations (response body can only be read once)
                const convo = await res.json();

                modalOverlay.classList.remove('visible');
                toast('Conversation created!', 'success');
                await loadConversations();

                // Auto-select the new conversation
                if (convo.id) selectConversation(convo.id);

            } catch (err) {
                toast(err.message);
            }
        });

        // ── User ID Resolution ─────────────────────────────────
        const userIdCache = {};

        async function loadUsers() {
            try {
                const res = await fetch(`${API}/users`, { headers: headers() });
                if (!res.ok) return;
                const users = await res.json();
                users.forEach(u => {
                    userIdCache[u.name.toLowerCase()] = u.id;
                });
            } catch { /* silent */ }
        }

        function resolveUserId(username) {
            return userIdCache[username] || null;
        }

        // ── Clean up WebSocket on page unload ──────────────────
        window.addEventListener('beforeunload', closeWebSocket);

        // ── Init ───────────────────────────────────────────────
        (async () => {
            await loadUsers();
            loadConversations();
        })();
    </script>
</body>
</html>
